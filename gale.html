    <!-- SLIDER CSS -->
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #000000, #0a0a0a, #111);
            margin: 0;
            padding: 0;
            color: white;
        }

        /* Contenedor flexible para slider y botones */
        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: -80px auto;
        }

        .slider {
            width: 90%;
            max-width: 900px;
            height: 70vh; /* altura base */
            background-color: #000;
            border-radius: 15px;
            overflow: hidden;
        }

        .slider ul {
            display: flex;
            padding: 0;
            margin: 0;
            width: 100%;
            transition: transform 0.5s ease-in-out;
        }

        .slider li {
            list-style: none;
            flex: 0 0 100%;
            overflow: hidden;
            border-radius: 15px;
        }

        .slider li img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .slider li:hover img {
            transform: scale(1.05);
        }

        /* Botones centrados */
        .slider-buttons {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .slider-buttons button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #232124;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .slider-buttons button:hover {
            background-color: #312f33;
        }

        /* Responsivo tablets */
        @media (max-width: 1024px) {
            .slider {
                height: 60vh;
            }
        }

        /* Responsivo móviles */
        @media (max-width: 768px) {
            .slider {
                height: 50vh;
            }
            .slider-buttons {
                margin-top: 10px;
                flex-direction: row;
                gap: 8px;
            }
        }
    </style>
</head>

<!-- SLIDER JS -->
<script>
    let index = 0;
    const slider = document.getElementById("slider");
    const slides = document.querySelectorAll("#slider li");
    const totalSlides = slides.length;

    function moverSlider() {
        slider.style.transform = `translateX(-${index * 100}%)`;
    }

    function siguiente() {
        index = (index + 1) % totalSlides;
        moverSlider();
    }

    function anterior() {
        index = (index - 1 + totalSlides) % totalSlides;
        moverSlider();
    }

    setInterval(siguiente, 5000);
</script>
